<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    text-decoration: none;
    list-style: none;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height: 100vh;
    width: 100%;
}

header{
    background-color: teal;
    padding: 20px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo{
    font-size: 30px;
    font-weight: 100;
    text-transform: uppercase;
    color: white;
}

li{
    display: inline-block;
    margin: 0 10px;
}

li a{
    color: white;
    font-size: 18px;
    font-weight: 400;
    margin-right: 25px;
}

li a:hover{
    color: black;
}

button{
    width: 90px;
    height: 35px;
    background-color: black;
    color: white;
    margin-left: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover{
    background-color: #373737;
}
    </style>
</head>
<body>
    <header>
        <a class="logo">Navbar</a>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <button type="button">sign in</button>
            <button type="button">sign up</button>
        </ul>
    </header>
</body>
</html>
