<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #dfe3ea;
        }

        .card{
            width:320px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .top{
            height: 140px;
            background-color: #0f172a;
        }

        .profile img{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #3b82f6;
            margin-top: -60px;
            background: white;
        }
        .content{
            padding: 20px;
        }

        .content h2{
            font-size: 30px;
            margin-top: 10px;
        }

        .content h3{
            color: #3b82f6;
            margin: 10px 0;
        }

        .content p{
            color: gray;
            line-height: 25px;;
        }

        .info{
            margin-top: 20px;
        }
        .info p{
            margin: 10px 0;
        }


    </style>
</head>
<body>
    <div class="card">
        <div class="top"></div>
        <div class="profile">
            <img src="profile image.jpg" alt="image profile">
        </div>
        <div class="content">
            <h2>Abdullah Usman</h2>
            <h3>Web Developer</h3>
            <p>passionate web development creating amazing websites and applications.</p>
        </div>    
            <div class="info">
                <p>email: abdullahusman@example.com</p>
                <p>phone: +1234567890</p>
                <p>location: faisalabad</p>
            </div>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-github"></i></a>
            </div>

        
    </div>
    
</body>
</html>
