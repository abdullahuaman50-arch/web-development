<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body{
            background-color: #f5f5f5;
        }

        .header{
            width: 100%;
            height: 70px;
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .left
        {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu{
            font-size: 25px;
            cursor: pointer;
        }

        .logo{
            color: red;
            font-size: 28px;
            font-weight: bold;
        }

        .center{
            display: flex;
            align-items: center;
        }

        .search-box{
            width: 300px;
            height: 38px;
            padding-left: 10px;
            border: 1px solid gray;
            border-radius: 20px 0 0 20px;
            outline: none;
        }

        .search-btn{
            height:38px;
            width: 60px;
            border: 1px solid gray;
            border-left: none;
            background-color: #eee;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }

        .right{
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 22px;
        }

    </style>
</head>
<body>
    <div class="header">

        <div class="left">
            <div class="menu">☰</div>
            <div class="logo">YouTube</div>
        </div>

        <div class="center">
            <input type="text" placeholder="Search" class="search-box">
            <button class="search-btn">🔍</button>
        </div>

        <div class="right">
            <div><i class="fa-solid fa-video"></i></div>
            <div><i class="fa-regular fa-bell"></i></div>
            <div><i class="fa-solid fa-circle-user"></i></div>
        </div>
    </div>
    
</body>
</html>
